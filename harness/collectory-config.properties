# Disposable collectory for the integration tests: MySQL in the same compose project, JWTs from harness/issuer.mjs.
grails.serverURL=http://localhost:8080
serverName=http://localhost:8080
dataSource.url=jdbc:mysql://127.0.0.1:3307/collectory?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
dataSource.username=collectory
dataSource.password=collectory
security.cas.enabled=false
# OIDC login must be on (ala-auth needs an SSOStrategy bean); it points at the fake issuer, which nobody logs in to:
# the tests reach the admin pages with a user's Bearer token.
security.oidc.enabled=true
security.oidc.discoveryUri=http://localhost:4000/.well-known/openid-configuration
security.oidc.clientId=ci
security.oidc.secret=ci
security.apikey.enabled=false
security.apikey.checkEnabled=false
security.jwt.enabled=true
security.jwt.discoveryUri=http://localhost:4000/.well-known/openid-configuration
security.jwt.clientId=ci
security.jwt.callUserInfoEndpoint=false
security.jwt.fallbackToLegacyBehaviour=true
gbifRegistrationEnabled=false
gbifRegistrationDryRun=true
gbifApiUrl=https://api.gbif.org/v1/
# BootStrap fetches <biocacheServicesUrl>/facets/i18n and does not start if the host refuses the connection: any HTTP server will do
biocacheServicesUrl=http://localhost:4000/biocache
gbifDefaultEntityCountry=ES
# ala-install deploys default-gbif-licence-mapping.json; without it every data resource show page fails. "null" uses
# the built-in mapping.
gbifLicenceMappingUrl=null
headerAndFooter.baseURL=http://localhost:9/commonui
