name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly: catch changes of collectory releases and of the public demo
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    # New advisories land against an unchanged lockfile, so the nightly run only warns (Dependabot opens the fix);
    # pushes and pull requests still fail on them.
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || { echo "::warning::npm audit found high-severity advisories"; exit 1; }

  integration:
    # A disposable collectory (official WAR) + MySQL + a fake OIDC issuer whose JWTs collectory accepts:
    # every write, the admin forms and the auth split are exercised against the real thing.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collectory: ["6.3.0", "5.1.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/collectory-mcp
          key: collectory-war-${{ matrix.collectory }}
      - run: harness/up.sh ${{ matrix.collectory }}
      - run: npm run test:integration
        env:
          COLLECTORY_TEST_URL: http://localhost:8080
          COLLECTORY_TEST_MINT: http://localhost:4000/mint
      - if: failure()
        run: docker compose -p collectory-mcp-it -f harness/docker-compose.yml logs --tail 300 collectory
        env:
          COLLECTORY_WAR: /dev/null

  public-demo:
    # Anonymous checks against the LA demo stack. Jenkins jobs redeploy it (it then redirects to an error page for a
    # while), so wait up to 10 minutes for it before skipping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: demo
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -m 30 -H "Accept: application/json" https://collections.l-a.site/ws/dataHub | grep -q "^\s*\["; then echo "up=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 30
          done
          echo "up=false" >> "$GITHUB_OUTPUT"; echo "::notice::collections.l-a.site is not available after 10 minutes (a Jenkins redeploy?): skipped"
      - if: steps.demo.outputs.up == 'true'
        run: npm run test:integration
        env:
          COLLECTORY_TEST_URL: https://collections.l-a.site
